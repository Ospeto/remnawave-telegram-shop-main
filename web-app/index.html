<!doctype html>
<html lang="en" class="theme-dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Wavy Private Server</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Apply theme BEFORE React renders to prevent flash of white -->
  <script>
    (function () {
      try {
        var tg = window.Telegram && window.Telegram.WebApp;
        var scheme = tg && tg.colorScheme ? tg.colorScheme : 'dark';
        document.documentElement.classList.add('theme-' + scheme);
        document.documentElement.setAttribute('data-theme', scheme);
        // Set immediate background to prevent white flash
        document.documentElement.style.backgroundColor = scheme === 'light' ? '#f2f2f7' : '#0f0f1a';
        document.documentElement.style.color = scheme === 'light' ? '#1c1c1e' : '#ffffff';
      } catch (e) {
        // Fallback: dark mode
        document.documentElement.classList.add('theme-dark');
        document.documentElement.style.backgroundColor = '#0f0f1a';
        document.documentElement.style.color = '#ffffff';
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
